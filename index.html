
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fix-Traffic</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
#map { background:#e5e5e5; }
#car {
  width:18px;
  height:18px;
  background:#1565c0;
  border:3px solid white;
  border-radius:50%;
  box-shadow:0 0 5px #555;
}
#status {
  position:absolute;
  top:10px;
  left:50px;
  z-index:1000;
  background:white;
  padding:8px;
  font:14px Arial;
  border-radius:5px;
}
</style>
</head>
<body>
<div id="map"></div>
<div id="status">Waiting for GPS...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map', {
  zoomControl:false,
  rotate:false
}).setView([41.7151,44.8271],14);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'© OpenStreetMap'}
).addTo(map);

var car = L.marker([41.7151,44.8271], {
  icon:L.divIcon({
    html:'<div id="car"></div>',
    className:'',
    iconSize:[24,24],
    iconAnchor:[12,12]
  })
}).addTo(map);

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(
    function(pos) {
      var lat=pos.coords.latitude;
      var lng=pos.coords.longitude;
      car.setLatLng([lat,lng]);
      map.setView([lat,lng],14);
      document.getElementById('status').textContent =
        'GPS accuracy: '+Math.round(pos.coords.accuracy)+' m';
    },
    function(err) {
      document.getElementById('status').textContent =
        'GPS error: '+err.message;
    },
    {enableHighAccuracy:true,maximumAge:2000,timeout:15000}
  );
}
</script>
</body>
</html>
